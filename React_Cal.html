<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Máy tính ReactJS</title>
  

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>


  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f4f6f9;
      font-family: Arial, sans-serif;
      margin: 0;
    }

    .calculator {
      width: 300px;
      background-color: #222;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    .display {
      width: 100%;
      height: 60px;
      background-color: #333;
      color: #fff;
      font-size: 2rem;
      text-align: right;
      padding: 10px;
      box-sizing: border-box;
      border-radius: 6px;
      margin-bottom: 15px;
      word-wrap: break-word;
      overflow-x: auto;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      padding: 15px;
      font-size: 1.2rem;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background-color: #444;
      color: #fff;
      transition: background 0.2s;
    }

    button:hover { background-color: #555; }
    .btn-operator { background-color: #f39c12; }
    .btn-operator:hover { background-color: #e67e22; }
    .btn-clear { background-color: #e74c3c; }
    .btn-clear:hover { background-color: #c0392b; }
    .btn-equal { background-color: #2ecc71; }
    .btn-equal:hover { background-color: #27ae60; }
  </style>
</head>
<body>

  <!-- Thẻ chứa ứng dụng React -->
  <div id="root"></div>

  <!-- Code ReactJS đầy đủ Component, Props, State -->
  <script type="text/babel">
    const { useState } = React;

    // Component 1: Display (Màn hình hiển thị)
    function Display({ value }) {
      return (
        <div id="display" className="display">
          {value}
        </div>
      );
    }

    // Component 2: Button (Nút bấm tái sử dụng)
    function Button({ label, className = '', onClick }) {
      return (
        <button className={className} onClick={() => onClick(label)}>
          {label}
        </button>
      );
    }

    // Component 3: Calculator (Máy tính chính)
    function Calculator() {
      const [displayValue, setDisplayValue] = useState("0");

      const handleButtonClick = (value) => {
        if (value === "Clear") {
          setDisplayValue("0");
        } else if (value === "=") {
          try {
            setDisplayValue(String(eval(displayValue)));
          } catch (error) {
            setDisplayValue("SYNTAX ERROR");
          }
        } else {
          if (displayValue === "0" || displayValue === "SYNTAX ERROR") {
            setDisplayValue(value);
          } else {
            setDisplayValue(displayValue + value);
          }
        }
      };

      return (
        <div className="calculator">
          <Display value={displayValue} />
          
          <div className="buttons">
            <Button label="Clear" className="btn-clear" onClick={handleButtonClick} />
            <Button label="/" className="btn-operator" onClick={handleButtonClick} />
            <Button label="*" className="btn-operator" onClick={handleButtonClick} />
            <Button label="-" className="btn-operator" onClick={handleButtonClick} />

            <Button label="7" onClick={handleButtonClick} />
            <Button label="8" onClick={handleButtonClick} />
            <Button label="9" onClick={handleButtonClick} />
            <Button label="+" className="btn-operator" onClick={handleButtonClick} />

            <Button label="4" onClick={handleButtonClick} />
            <Button label="5" onClick={handleButtonClick} />
            <Button label="6" onClick={handleButtonClick} />
            <Button label="=" className="btn-equal" onClick={handleButtonClick} />

            <Button label="1" onClick={handleButtonClick} />
            <Button label="2" onClick={handleButtonClick} />
            <Button label="3" onClick={handleButtonClick} />
            <Button label="0" onClick={handleButtonClick} />
          </div>
        </div>
      );
    }

    // Kết nối React vào HTML
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Calculator />);
  </script>
</body>
</html>
